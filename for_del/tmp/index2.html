<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMI — Хедер (Тест)</title>
  <link rel="stylesheet" href="assets/css/style2.css">
</head>
<body>

  <!-- БЛОК 1. ХЕДЕР -->
  <header class="topbar">
    <div class="wrap topbar__in">
      <a href="index.html" class="logo">
        <img src="assets/icons/omi_logo.svg" alt="OMI" width="56" height="56">
      </a>
      <nav class="nav" aria-label="Основная навигация">
        <ul>
          <li><a href="#furniture">Мебель</a></li>
          <li><a href="#salons">Салоны</a></li>
          <li><a href="#projects">Проекты</a></li>
          <li><a href="#reviews">Отзывы</a></li>
          <li><a href="#faq">Вопросы</a></li>
        </ul>
      </nav>
      <div class="topbar__right">
        <a href="tel:+79021234567" class="topbar__phone">+7 (902) 123-45-67</a>
        <a href="#contacts" class="btn">Консультация</a>
        <button class="burger" aria-expanded="false" aria-controls="mnav" aria-label="Открыть меню">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Мобильное меню -->
  <div class="mnav" id="mnav">
    <button class="mnav__close" aria-label="Закрыть меню">×</button>
    <nav aria-label="Мобильная навигация">
      <ul>
        <li><a href="#furniture" class="ml">Мебель</a></li>
        <li><a href="#salons" class="ml">Салоны</a></li>
        <li><a href="#projects" class="ml">Проекты</a></li>
        <li><a href="#reviews" class="ml">Отзывы</a></li>
        <li><a href="#faq" class="ml">Вопросы</a></li>
      </ul>
    </nav>
    <a href="#contacts" class="btn">Консультация</a>
    <a href="tel:+79021234567" class="mnav__phone">+7 (902) 123-45-67</a>
  </div>

  <!-- ПЛАВАЮЩИЕ ИКОНКИ СОЦСЕТЕЙ -->
  <div class="floating-socials">
    <a href="https://wa.me/79021234567" target="_blank" rel="noopener" class="social-link" aria-label="WhatsApp">
      <img src="assets/icons/whatsapp_logo.svg" alt="WhatsApp" width="18" height="18">
    </a>
    <a href="https://t.me/omi" target="_blank" rel="noopener" class="social-link" aria-label="Telegram">
      <img src="assets/icons/telegram_logo.svg" alt="Telegram" width="18" height="18">
    </a>
    <a href="#" class="social-link" aria-label="MAX">
      <img src="assets/icons/max_logo.svg" alt="MAX" width="18" height="18">
    </a>
  </div>

  <!-- Inline-скрипт для работы бургера -->
  <script>
    (function () {
      var burger = document.querySelector('.burger');
      var mnav = document.getElementById('mnav');
      var mclose = document.querySelector('.mnav__close');

      function openMenu() {
        mnav.classList.add('open');
        burger.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        mnav.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      }

      burger.addEventListener('click', openMenu);
      mclose.addEventListener('click', closeMenu);

      mnav.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', closeMenu);
      });
    })();
  </script>
</body>
</html>
