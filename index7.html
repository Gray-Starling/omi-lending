<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMI — Готовые решения (Тест)</title>
  <link rel="stylesheet" href="assets/css/style7.css">
</head>
<body>

<!-- БЛОК 7: ГОТОВЫЕ РЕШЕНИЯ (мини-каталог, spotlight, тёмный) -->
<section id="solutions" class="solutions">
  <div class="wrap">

    <h2 class="fade">Готовые решения для ванной комнаты</h2>
    <p class="solutions__lead fade">
      Не знаете, с чего начать — выберите готовый комплект,
      а мы адаптируем размеры и материалы под ваше пространство.
    </p>

    <div class="carousel fade" id="solutions-carousel">
      <div class="carousel__mask carousel__mask--left" aria-hidden="true"></div>
      <div class="carousel__mask carousel__mask--right" aria-hidden="true"></div>

      <div class="carousel__stage" id="stage"></div>

      <button class="carousel__arrow carousel__arrow--prev" type="button" aria-label="Предыдущее решение">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="carousel__arrow carousel__arrow--next" type="button" aria-label="Следующее решение">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <div class="carousel__dots" role="tablist"></div>
    </div>

    <div class="solutions__custom fade">
      <p>Нужно другое решение? Соберём индивидуальное.</p>
      <a href="#contacts" class="btn">Рассчитать проект →</a>
    </div>

  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const noHover = matchMedia('(hover: none), (pointer: coarse)').matches;

  const fadeEls = document.querySelectorAll('.fade');
  if (reduced || !('IntersectionObserver' in window)) {
    fadeEls.forEach(el => el.classList.add('visible'));
  } else {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    }), { threshold: 0.15 });
    fadeEls.forEach(el => io.observe(el));
  }

  // ===== ДАННЫЕ КАТАЛОГА =====
  const slides = [
    { image: 'assets/img/solution-scandinavia.jpg', title: 'Скандинавия', price: 'от 50 000 ₽',
      desc: 'Лаконичная тумба с керамической раковиной в светлом дубе.',
      bullets: ['Тумба с ящиками и доводчиками', 'Керамическая раковина', 'Фасады из влагостойкого МДФ'] },
    { image: 'assets/img/solution-loft.jpg', title: 'Лофт', price: 'от 80 000 ₽',
      desc: 'Полный санитарный блок: инсталляция, унитаз и шкаф над ней.',
      bullets: ['Унитаз с инсталляцией', 'Хромированная кнопка смыва', 'Шкаф над инсталляцией'] },
    { image: 'assets/img/solution-modern.jpg', title: 'Модерн', price: 'от 60 000 ₽',
      desc: 'Зона хранения и организации в современном стиле.',
      bullets: ['Шкаф над стиральной машиной', 'Пенал для хранения', 'Единый стиль фасадов'] },
    { image: 'assets/img/solution-scandinavia.jpg', title: 'Классика', price: 'от 150 000 ₽',
      desc: 'Полный комплект ванной комнаты: мебель, сантехника, аксессуары.',
      bullets: ['Тумба с раковиной и зеркалом', 'Пенал и шкаф над инсталляцией', 'Подбор сантехники и аксессуаров'] }
  ];

  const stage = document.getElementById('stage');
  const dotsWrap = document.querySelector('.carousel__dots');
  const prev = document.querySelector('.carousel__arrow--prev');
  const next = document.querySelector('.carousel__arrow--next');
  const car = document.getElementById('solutions-carousel');

  slides.forEach((s, i) => {
    const el = document.createElement('article');
    el.className = 'solution-slide';
    el.dataset.index = i;
    el.innerHTML = `
      <div class="solution-slide__media" style="background-image:url('${s.image}')" aria-hidden="true"></div>
      <div class="solution-slide__body">
        <h3 class="solution-slide__title">${s.title}</h3>
        <p class="solution-slide__desc">${s.desc}</p>
        <ul class="solution-slide__list">${s.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
        <div class="solution-slide__footer">
          <span class="solution-slide__price">${s.price}</span>
          <a href="#contacts" class="btn">Выбрать</a>
        </div>
      </div>`;
    stage.appendChild(el);

    const d = document.createElement('button');
    d.className = 'carousel__dot'; d.type = 'button';
    d.setAttribute('role', 'tab');
    d.setAttribute('aria-label', `Слайд ${i + 1}: ${s.title}`);
    dotsWrap.appendChild(d);
  });

  const allSlides = Array.from(stage.children);
  const allDots = Array.from(dotsWrap.children);
  let current = 0, autoTimer = null, hovered = false;
  let lastDir = 1, first = true;   // <-- добавили

  function render() {
    const n = slides.length;
    const w = allSlides[0].offsetWidth;
    const scale = 0.8, gap = 24;
    const offset = w / 2 + gap + (w * scale) / 2;
    // «за экраном»: полуширина стейджа + полуширина карточки в scale + запас
    const exitOff = stage.clientWidth / 2 + (w * scale) / 2 + 60;

    allSlides.forEach((el, i) => {
      const diff = ((i - current) % n + n) % n;
      el.classList.remove('solution-slide--center', 'solution-slide--side', 'solution-slide--hidden');
      let tx = 0, sc = 1, op = 1, z = 3;

      if (diff === 0)          { el.classList.add('solution-slide--center'); tx = 0;       sc = 1;    op = 1;  z = 3; }
      else if (diff === 1)     { el.classList.add('solution-slide--side');   tx = offset;  sc = scale; op = .9; z = 2; }
      else if (diff === n - 1) { el.classList.add('solution-slide--side');   tx = -offset; sc = scale; op = .9; z = 2; }
      // СКРЫТАЯ: уезжает за экран в свою сторону, а не в центр
      else {
        el.classList.add('solution-slide--hidden');
        tx = lastDir === 1 ? -exitOff : exitOff;
        sc = scale; op = 0; z = 1;
      }

      // ВХОДЯЩАЯ: перед плавным въездом невидимо паркуется за экраном со стороны входа
      const prevRole = el._role;
      if (prevRole === 'hidden' && (el.classList.contains('solution-slide--side'))) {
        const enterTx = el.classList.contains('solution-slide--side') && tx > 0 ? exitOff : -exitOff;
        el.style.transition = 'none';
        el.style.opacity = '0';
        el.style.transform = `translate(-50%,-50%) translateX(${enterTx}px) scale(${scale})`;
        void el.offsetWidth;           // форсируем применение
        el.style.transition = '';      // возвращаем плавную анимацию
      }
      if (first) el.style.transition = 'none';

      el._role = el.classList.contains('solution-slide--center') ? 'center'
               : el.classList.contains('solution-slide--side') ? 'side' : 'hidden';

      el.style.zIndex = z;
      el.style.opacity = op;
      el.style.transform = `translate(-50%,-50%) translateX(${tx}px) scale(${sc})`;
    });

    // Первый кадр — без анимации (карточки просто появляются)
    if (first) {
      void stage.offsetWidth;
      allSlides.forEach(el => { el.style.transition = ''; });
      first = false;
    }

    allDots.forEach((d, i) => d.classList.toggle('carousel__dot--active', i === current));
  }

  function goTo(i, dir) {
    const n = slides.length;
    const nextPos = ((i % n) + n) % n;
    if (nextPos === current) return;
    if (dir === undefined) {
      const fwd = (nextPos - current + n) % n;
      dir = fwd <= n / 2 ? 1 : -1;
    }
    lastDir = dir;
    current = nextPos;
    render();
  }

  function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function startAuto() {
    stopAuto();
    if (reduced || hovered || noHover) return;
    autoTimer = setInterval(() => goTo(current + 1, 1), 6000);
  }

  prev.addEventListener('click', () => { goTo(current - 1, -1); startAuto(); });
  next.addEventListener('click', () => { goTo(current + 1, 1); startAuto(); });
  allDots.forEach((d, i) => d.addEventListener('click', () => { goTo(i); startAuto(); }));

  stage.addEventListener('click', e => {
    const s = e.target.closest('.solution-slide');
    if (!s || e.target.closest('.btn')) return;
    const idx = +s.dataset.index;
    if (idx !== current) { goTo(idx); startAuto(); }
  });

  car.addEventListener('mouseenter', () => { hovered = true; stopAuto(); });
  car.addEventListener('mouseleave', () => { hovered = false; startAuto(); });

  let sx = 0, sy = 0, tr = false;
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; tr = true; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (!tr) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      goTo(current + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
      startAuto();
    }
    tr = false;
  });

  window.addEventListener('resize', render);
  render();
  startAuto();
});
</script>

</body>
</html>
